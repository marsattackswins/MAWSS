name: CI - TypeScript & Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Least privilege: this job only reads the repository.
permissions:
  contents: read

# One run per branch: a new push supersedes the in-flight run.
concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-unit:
    # Pinned, not ubuntu-latest: the "latest" label is moving to a new Ubuntu
    # release, which changes the preinstalled toolchain mid-stream.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        # Node 22 matches deploy/Dockerfile (node:22-alpine) and the local
        # toolchain; the v7 action runs on the Node 24 runtime itself.
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --runInBand
